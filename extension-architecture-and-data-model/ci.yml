name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: node --check scripts/validate-production.mjs
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
