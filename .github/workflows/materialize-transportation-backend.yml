name: Add transportation backend project
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/materialize-transportation-backend.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Extract and sanitize project
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZIP_DEFLATED, ZipFile
          import shutil, tempfile
          archive = Path('enterprise-transportation-backend-architecture.zip')
          project = Path('enterprise-transportation-backend-architecture')
          if project.exists():
              raise SystemExit('Project folder already exists; refusing to overwrite.')
          temp = Path(tempfile.mkdtemp())
          try:
              with ZipFile(archive) as source:
                  for entry in source.infolist():
                      rel = PurePosixPath(entry.filename)
                      if rel.is_absolute() or '..' in rel.parts:
                          raise SystemExit('Unsafe archive path.')
                      if not rel.parts or entry.is_dir() or any(p in {'node_modules','.next','.git','out','build','coverage'} for p in rel.parts):
                          continue
                      if rel.name in {'.env','drizzle.config.json','next-env.d.ts'} or rel.name.endswith('.tsbuildinfo') or (rel.name.startswith('.env.') and rel.name != '.env.example'):
                          continue
                      dest = (temp / Path(*rel.parts)).resolve()
                      if temp.resolve() not in dest.parents:
                          raise SystemExit('Unsafe archive path.')
                      dest.parent.mkdir(parents=True, exist_ok=True)
                      dest.write_bytes(source.read(entry))
              env = temp / '.env.example'
              lines = env.read_text(encoding='utf-8').splitlines()
              matches = [i for i, line in enumerate(lines) if line.startswith('DATABASE_URL=')]
              if len(matches) != 1:
                  raise SystemExit('Expected one DATABASE_URL in .env.example.')
              lines[matches[0]] = 'DATABASE_URL=postgresql://localhost:5432/app_db'
              env.write_text('\n'.join(lines) + '\n', encoding='utf-8')
              (temp / 'drizzle.config.ts').write_text('import "dotenv/config";\nimport { defineConfig } from "drizzle-kit";\n\nconst databaseUrl = process.env.DATABASE_URL;\nif (!databaseUrl) throw new Error("DATABASE_URL is required to run Drizzle Kit");\n\nexport default defineConfig({ dialect: "postgresql", schema: "./src/db/schema.ts", dbCredentials: { url: databaseUrl } });\n', encoding='utf-8')
              (temp / '.gitignore').write_text('.env\n.env.*\n!.env.example\nnode_modules/\n.next/\nout/\nbuild/\ncoverage/\n*.tsbuildinfo\n', encoding='utf-8')
              readme = temp / 'README.md'
              with readme.open('a', encoding='utf-8') as f:
                  f.write('\n\nThe example DATABASE_URL is a safe local placeholder. Replace it with a reachable PostgreSQL URL before running Drizzle commands.\n')
              project.mkdir()
              for item in temp.iterdir():
                  shutil.move(str(item), str(project / item.name))
          finally:
              shutil.rmtree(temp, ignore_errors=True)
          replacement = archive.with_suffix('.zip.tmp')
          with ZipFile(replacement, 'w', ZIP_DEFLATED) as output:
              for file in sorted(project.rglob('*')):
                  if file.is_file():
                      output.write(file, file.relative_to(project).as_posix())
          replacement.replace(archive)
          index = Path('README.md')
          text = index.read_text(encoding='utf-8')
          if './enterprise-transportation-backend-architecture/' not in text:
              index.write_text(text.rstrip() + '\n\n## Projects\n\n- [Enterprise Transportation Backend Architecture](./enterprise-transportation-backend-architecture/) ([ZIP archive](./enterprise-transportation-backend-architecture.zip))\n', encoding='utf-8')
          PY
      - name: Verify project
        working-directory: enterprise-transportation-backend-architecture
        env:
          DATABASE_URL: postgresql://localhost:5432/app_db
        run: |
          npm install --no-package-lock
          npm run lint
          npm run typecheck
          npm run build
      - name: Commit project folder
        run: |
          rm .github/workflows/materialize-transportation-backend.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A enterprise-transportation-backend-architecture enterprise-transportation-backend-architecture.zip README.md .github/workflows/materialize-transportation-backend.yml
          git commit -m 'Add transportation backend project folder'
          git push origin HEAD:main
