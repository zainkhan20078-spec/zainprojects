<svg width="540" height="960" viewBox="0 0 540 960" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0E1A"/>
      <stop offset="50%" style="stop-color:#121628"/>
      <stop offset="100%" style="stop-color:#0A0E1A"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="540" height="960" fill="url(#bgGradient2)"/>

  <!-- Decorative circles -->
  <circle cx="490" cy="20" r="75" fill="#C6FF2D" opacity="0.03"/>
  <circle cx="20" cy="910" r="50" fill="#C6FF2D" opacity="0.03"/>
  <circle cx="270" cy="480" r="50" fill="#C6FF2D" opacity="0.03"/>

  <!-- Accent lines -->
  <line x1="20" y1="50" x2="520" y2="50" stroke="#C6FF2D" stroke-width="2" opacity="0.3"/>
  <line x1="20" y1="910" x2="520" y2="910" stroke="#C6FF2D" stroke-width="2" opacity="0.3"/>

  <!-- Logo -->
  <rect x="20" y="20" width="60" height="24" rx="4" fill="rgba(255,255,255,0.1)"/>
  <text x="28" y="38" font-family="Arial, sans-serif" font-weight="bold" font-size="10" fill="#FFFFFF">AI ADS</text>

  <!-- Badge -->
  <rect x="200" y="100" width="140" height="28" rx="14" fill="rgba(198,255,45,0.15)" stroke="rgba(198,255,45,0.3)" stroke-width="2"/>
  <text x="270" y="119" font-family="Arial, sans-serif" font-weight="bold" font-size="10" fill="#C6FF2D" text-anchor="middle" letter-spacing="2">LONDON FIRST</text>

  <!-- Headline -->
  <text x="270" y="170" font-family="Arial, sans-serif" font-weight="900" font-size="42" fill="#FFFFFF" text-anchor="middle">London first.</text>
  <text x="270" y="230" font-family="Arial, sans-serif" font-weight="900" font-size="42" fill="#FFFFFF" text-anchor="middle">Your next</text>
  <text x="270" y="290" font-family="Arial, sans-serif" font-weight="900" font-size="42" fill="#C6FF2D" text-anchor="middle">customers next.</text>

  <!-- Subheadline -->
  <text x="270" y="345" font-family="Arial, sans-serif" font-weight="500" font-size="14" fill="rgba(255,255,255,0.75)" text-anchor="middle">
    <tspan x="270" dy="0">AI-assisted creative, local targeting,</tspan>
    <tspan x="270" dy="20">and clear weekly reporting for your</tspan>
    <tspan x="270" dy="20">Facebook and Instagram campaigns.</tspan>
  </text>

  <!-- CTA Button -->
  <rect x="170" y="430" width="200" height="50" rx="12" fill="#C6FF2D" filter="url(#glow2)"/>
  <text x="270" y="462" font-family="Arial, sans-serif" font-weight="800" font-size="16" fill="#0A0E1A" text-anchor="middle" letter-spacing="1">BOOK NOW</text>
</svg>